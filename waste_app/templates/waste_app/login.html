{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Haritha Karma Sena</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1f8f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Login Card */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 36px 32px 28px;
            box-shadow: 0 10px 30px rgba(22, 101, 52, 0.08);
            position: relative;
            z-index: 2;
        }

        /* Logo Area */
        .brand-logo {
            color: #166534;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .brand-title {
            font-weight: 800;
            color: #166534;
            font-size: 1.35rem;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }
        .brand-subtitle {
            font-size: 0.8rem;
            color: #4b5563;
            font-weight: 600;
            margin-bottom: 22px;
        }

        /* Inner Content Card Area */
        .inner-box {
            background-color: #ffffff;
            border: 1px solid #edf2f0;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .welcome-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #064e3b;
            margin-bottom: 3px;
        }
        .welcome-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Form Inputs */
        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
        }
        .form-control-custom {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding: 8px 42px 8px 42px;
            font-size: 0.92rem;
            color: #1e293b;
            transition: 0.2s ease;
        }
        .form-control-custom:focus {
            outline: none;
            border-color: #166534;
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.12);
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .toggle-password:hover {
            color: #166534;
        }

        /* Options (Remember & Forgot) */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            margin-bottom: 20px;
            color: #475569;
        }
        .options-row input[type="checkbox"] {
            accent-color: #166534;
            margin-right: 6px;
        }
        .forgot-link {
            color: #166534;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-login {
            background-color: #064e3b;
            color: #ffffff;
            font-weight: 700;
            border-radius: 12px;
            height: 46px;
            border: none;
            width: 100%;
            font-size: 0.95rem;
            transition: 0.2s ease;
        }
        .btn-login:hover {
            background-color: #043d2e;
            color: #ffffff;
        }

        /* Footer Link */
        .register-text {
            font-size: 0.85rem;
            color: #475569;
            margin-top: 18px;
            text-align: center;
        }
        .register-text a {
            color: #166534;
            font-weight: 700;
            text-decoration: none;
        }
        .register-text a:hover {
            text-decoration: underline;
        }

        /* Bottom Garbage Truck Illustration Banner */
        .bottom-vector {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Top Brand Header -->
        <div class="text-center">
            <div class="brand-logo">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h1 class="brand-title">Haritha Karma Sena</h1>
            <p class="brand-subtitle">Smart Waste Management System</p>
        </div>

        <!-- Inner Box with Form -->
        <div class="inner-box">
            <h2 class="welcome-title">Welcome Back!</h2>
            <p class="welcome-subtitle">Login to continue</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger py-2 px-3 mb-3 text-center" style="font-size: 0.82rem; border-radius: 8px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <!-- Username Input -->
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" name="username" class="form-control-custom" placeholder="Username / Email" required autofocus>
                </div>

                <!-- Password Input -->
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" name="password" id="passwordField" class="form-control-custom" placeholder="Password" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePasswordBtn"></i>
                </div>

                <!-- Options -->
                <div class="options-row">
                    <label class="d-flex align-items-center m-0" style="cursor: pointer;">
                        <input type="checkbox" name="remember_me"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-login">Login</button>
            </form>

            <!-- Register Link -->
            <p class="register-text">
                Don't have an account? <a href="{% url 'register' %}">Register</a>
            </p>
        </div>
    </div>

    <!-- Bottom Illustration (Truck & Green Vector) -->
    <div class="bottom-vector">
        <svg viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-height: 100px;">
            <path d="M0 70 C 300 20, 600 100, 1200 40 L 1200 120 L 0 120 Z" fill="#dcfce7" opacity="0.6"/>
            <path d="M0 90 C 400 50, 800 110, 1200 70 L 1200 120 L 0 120 Z" fill="#bbf7d0" opacity="0.8"/>
        </svg>
    </div>

    <!-- Password Hide/Show Script -->
    <script>
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordField = document.getElementById('passwordField');

        togglePasswordBtn.addEventListener('click', function () {
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
