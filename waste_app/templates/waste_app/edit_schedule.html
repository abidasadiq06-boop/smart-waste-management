<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Waste Schedule</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f5; padding: 40px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
        h2 { color: #198754; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; margin-bottom: 6px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .help-text { font-size: 12px; color: #666; margin-top: 5px; margin-bottom: 20px; }
        button { background-color: #198754; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .back { display: inline-block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🗓️ Edit Schedule - {{ month_name }}</h2>
        <form method="POST">
            {% csrf_token %}
            <label>Items to be Collected:</label>
            <textarea name="waste_items" rows="4" placeholder="e.g. Plastic Waste, Paper Waste, Glass Waste">{{ schedule.waste_items }}</textarea>
            <div class="help-text">Enter items separated by commas (e.g., Plastic Waste, Metal Cans)</div>

            <button type="submit">Update Schedule</button>
        </form>
        <a href="{% url 'admin_dashboard' %}" class="back">← Back to Dashboard</a>
    </div>
</body>
</html>
