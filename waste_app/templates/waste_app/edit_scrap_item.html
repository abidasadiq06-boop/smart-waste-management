<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Scrap Item</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #198754;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #146c43;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #198754;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>♻️ Edit Scrap Item</h2>
      <form method="POST">
    {% csrf_token %}
    
    <label>Scrap Item Name</label>
    <input type="text" name="name" value="{{ item.name }}" required style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px;">

    <label>Rate (₹/Kg)</label>
    <input type="number" step="0.01" name="rate" value="{{ item.rate_per_kg }}" required style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px;">

    <button type="submit" style="background-color: #198754; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
        Update Scrap Item
    </button>
</form>

    <a href="{% url 'admin_dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
